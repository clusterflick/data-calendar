on:
  workflow_dispatch:
  repository_dispatch:
    types: [release_event]

name: Generate Calendar

permissions:
  contents: read

jobs:
  generate_calendar:
    name: Generate and Release
    runs-on: ubuntu-latest
    # ncipollo/release-action creates a release + tag via GITHUB_TOKEN,
    # which requires contents: write (top-level default is contents: read).
    permissions:
      contents: write
    steps:
      - uses: clusterflick/.github/setup@main
      # Events link to each film's page on the website, which is addressed by
      # the id and title the combine stage settles on - so the calendars are
      # built from the same release the website is, not from the transformed
      # data that precedes it.
      - uses: clusterflick/release-downloader@v3
        with:
          token: ${{ secrets.PAT }}
          repository: "clusterflick/data-combined"
          latest: true
          fileName: "combined-data.json"
          out-file-path: "combined-data"

      - name: Generate Calendar
        run: npm run generate-calendar

      - name: Generate Tag
        run: echo "TAG=$(TZ=Europe/London date +'%Y%m%d.%H%M%S')" >> $GITHUB_ENV
      - uses: ncipollo/release-action@v1
        id: release
        with:
          allowUpdates: false
          artifactErrorsFailBuild: true
          artifacts: "calendar-data/*"
          makeLatest: true
          tag: ${{ env.TAG }}
          commit: main
          body: |
            Created by job ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - name: Output summary
        run: |
          echo "🔖 New release - ${{ steps.release.outputs.html_url }}" >> $GITHUB_STEP_SUMMARY

      # The website bakes these feeds into its venue calendar pages, so this is
      # the trigger for a combined release reaching the site - data-combined
      # deliberately doesn't dispatch it directly, or the build would race
      # ahead of the feeds it needs.
      - name: Repository Dispatch for clusterflick.com
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.PAT }}
          repository: clusterflick/clusterflick.com
          event-type: release_event
